services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=your gemini api key here
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=quant_evaluation
      - MONGODB_COLLECTION=evaluation_reports
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ~/Desktop/mongo-data:/data/db

volumes:
  mongodb_data:
